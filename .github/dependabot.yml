version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # The plugin compiles against the Jellyfin version named by targetAbi in
      # build.yaml, so minor/patch bumps would silently raise the minimum server.
      - dependency-name: "Jellyfin.*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      jellyfin:
        patterns:
          - "Jellyfin.*"
      test:
        patterns:
          - "xunit*"
          - "Microsoft.Testing.*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
