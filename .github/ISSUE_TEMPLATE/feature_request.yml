name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the suggestion. Please provide enough context for the feature to be evaluated and prioritised.

  - type: textarea
    id: motivation
    attributes:
      label: What problem does this solve?
      description: Describe the situation or limitation that prompted this request.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: How should SleepGuard behave differently? Be as specific as possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other approaches you thought about and why they are not ideal.

  - type: dropdown
    id: breaking
    attributes:
      label: Would this be a breaking change?
      options:
        - "No"
        - "Yes — existing config would need to be updated"
        - "Yes — default behaviour would change"
        - "Not sure"
    validations:
      required: true
