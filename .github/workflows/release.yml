name: Release

# The version in VERSION_FILE drives releases (see AGENTS.md). Pull requests
# must bump it when code changes. When CI passes on main and the version has no
# tag yet, this workflow tags it and publishes the GitHub release. Nothing is
# committed back to main. Optional secret RELEASE_TOKEN (a fine-grained token
# with Contents: write) publishes releases as you instead of github-actions.

on:
  pull_request:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  VERSION_FILE: build.yaml

jobs:
  version-bump:
    name: Version bump
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version bump when code changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # docs, test, ci, style, build, and chore pull requests ship nothing; chore(deps) does.
          if ! grep -qE '^chore\(deps\)' <<< "$TITLE" && grep -qE '^(docs|test|ci|style|build|chore)(\([^)]*\))?:' <<< "$TITLE"; then
            echo "\"$TITLE\" needs no release."; exit 0
          fi
          # Reads the first version-like line, which is the project version in every manifest used here.
          version() { git show "$1:$VERSION_FILE" | grep -m1 -E '^\s*"?(__)?version(__)?"?\s*[:=]' | grep -oE '[0-9]+(\.[0-9]+){2,3}' | head -n1; }
          code=$(git diff --name-only "$BASE" HEAD | grep -vE '(\.md$|^docs/|^\.github/|^\.claude/|^\.agents/|^LICENSE$)' || true)
          if [ -z "$code" ]; then echo "Only docs, CI, or agent files changed: no bump needed."; exit 0; fi
          base=$(version "$BASE"); head=$(version HEAD)
          if [ "$head" = "$base" ] || [ "$(printf '%s\n' "$base" "$head" | sort -V | tail -n1)" != "$head" ]; then
            echo "::error file=$VERSION_FILE::Code changed but the version did not go up ($base -> $head). Bump major, minor, or patch as AGENTS.md describes."
            exit 1
          fi
          echo "Version $base -> $head"

  release:
    name: Publish release
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.publish.outputs.released }}
      version: ${{ steps.publish.outputs.version }}
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tag and publish the version
        id: publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(grep -m1 -E '^\s*"?(__)?version(__)?"?\s*[:=]' "$VERSION_FILE" | grep -oE '[0-9]+(\.[0-9]+){2,3}' | head -n1)
          if [ -z "$version" ]; then echo "::error file=$VERSION_FILE::No version found"; exit 1; fi
          sha=$(git rev-parse HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag is already released. Bump the version in $VERSION_FILE to publish a new release."
            exit 0
          fi
          latest=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          if [ -n "$latest" ] && [ "$(printf '%s\n' "${latest#v}" "$version" | sort -V | tail -n1)" != "$version" ]; then
            echo "::error file=$VERSION_FILE::Version $version is older than the latest tag $latest"
            exit 1
          fi
          gh release create "$tag" --target "$sha" --title "$tag" --generate-notes
          echo "released=true" >> "$GITHUB_OUTPUT"

  # Jellyfin installs from a repository manifest, attached to every release so
  # releases/latest/download/manifest.json always serves the newest one. Each
  # release rebuilds it from the last attached copy, so main never needs a bot
  # commit. The zip's checksum is only known here.
  package:
    name: Package plugin and attach manifest
    needs: release
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Jellyfin.Plugin.SleepGuard.sln
      - run: dotnet build Jellyfin.Plugin.SleepGuard.sln -c Release --no-restore
      - run: dotnet test Jellyfin.Plugin.SleepGuard.sln -c Release --no-build
      - name: Publish and zip the plugin
        run: |
          dotnet publish src/Jellyfin.Plugin.SleepGuard/Jellyfin.Plugin.SleepGuard.csproj -c Release -o artifacts/SleepGuard /p:Version="$VERSION"
          cd artifacts/SleepGuard
          zip -r "../Jellyfin.Plugin.SleepGuard_$VERSION.zip" Jellyfin.Plugin.SleepGuard.dll Jellyfin.Plugin.SleepGuard.deps.json
      - name: Attach the zip to the release
        run: gh release upload "v$VERSION" "artifacts/Jellyfin.Plugin.SleepGuard_$VERSION.zip" --clobber
      - name: Build the repository manifest
        run: |
          mkdir -p _site
          # The newest release that carries a manifest holds every published version; the committed one seeds the first run.
          for tag in $(gh release list --limit 30 --json tagName -q '.[].tagName'); do
            gh release download "$tag" --pattern manifest.json --output previous.json --clobber 2>/dev/null && break
          done
          [ -s previous.json ] || cp manifest.json previous.json
          python3 - <<'PYEOF'
          import datetime, hashlib, json, os, re
          version = os.environ["VERSION"]
          repo = os.environ["GH_REPO"]
          zip_path = f"artifacts/Jellyfin.Plugin.SleepGuard_{version}.zip"
          target_abi = re.search(r"^targetAbi:\s*(\S+)", open("build.yaml").read(), re.M).group(1)
          with open("previous.json", encoding="utf-8-sig") as f:
              manifest = json.load(f)
          versions = [v for v in manifest[0]["versions"] if v["version"] != version]
          versions.insert(0, {
              "version": version,
              "changelog": f"https://github.com/{repo}/releases/tag/v{version}",
              "targetAbi": target_abi,
              "sourceUrl": f"https://github.com/{repo}/releases/download/v{version}/Jellyfin.Plugin.SleepGuard_{version}.zip",
              "checksum": hashlib.md5(open(zip_path, "rb").read()).hexdigest(),
              "timestamp": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          })
          manifest[0]["versions"] = versions
          with open("_site/manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=4)
              f.write("\n")
          PYEOF
      - name: Attach the manifest to the release
        run: gh release upload "v$VERSION" _site/manifest.json --clobber
