name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore Jellyfin.Plugin.SleepGuard.sln
      - name: Format check
        run: dotnet format Jellyfin.Plugin.SleepGuard.sln --verify-no-changes
      - name: Build
        run: dotnet build Jellyfin.Plugin.SleepGuard.sln -c Release --no-restore
      - name: Test
        run: >
          dotnet test Jellyfin.Plugin.SleepGuard.sln -c Release --no-build
          --collect:"XPlat Code Coverage" --results-directory coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          directory: coverage
          fail_ci_if_error: false
